<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout - RonaldinhoStore</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header"><a href="product.html" class="brand">RonaldinhoStore</a></header>
  <main class="container">
    <h1>Checkout</h1>
    <div id="checkoutSummary" class="card"></div>
    <form id="shippingForm" onsubmit="return false;" class="card">
      <label>Full name <input id="shipName" required></label>
      <label>Address <input id="shipAddress" required></label>
      <label>Amount paying <input id="amountPaid" type="number" step="0.01" required></label>
      <div class="buttons">
        <button id="confirmCheckout" type="button">Confirm</button>
        <button id="cancelCheckout" type="button">Cancel</button>
      </div>
    </form>
  </main>
  <script src="js/app.js"></script>
  <script>
    const trn = sessionStorage.getItem('loggedInUser');
    if(!trn){ alert('Please login'); window.location.href='index.html'; }
    renderCheckoutSummary(trn, 'checkoutSummary');
    document.getElementById('confirmCheckout').addEventListener('click', ()=>{
      const shipping = { name: document.getElementById('shipName').value.trim(), address: document.getElementById('shipAddress').value.trim() };
      const amount = parseFloat(document.getElementById('amountPaid').value);
      try {
        const invoice = checkout(trn, shipping, amount);
        alert('Checkout successful. Redirecting to invoice.');
        // store last invoice id in session to view
        sessionStorage.setItem('lastInvoice', invoice.invoiceNumber);
        window.location.href = 'invoice.html';
      } catch(e){ alert('Error: ' + e.message); }
    });
    document.getElementById('cancelCheckout').addEventListener('click', ()=> window.location.href='cart.html');
  </script>
</body>
</html>
