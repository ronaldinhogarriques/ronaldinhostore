<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cart - RonaldinhoStore</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a href="product.html" class="brand">RonaldinhoStore</a>
    <nav><a href="product.html">Products</a> | <a href="dashboard.html">Dashboard</a></nav>
  </header>
  <main class="container">
    <h1>Your Cart</h1>
    <div id="cartItems"></div>
    <div id="cartTotals" class="card"></div>
    <div class="buttons">
      <button id="clearCart">Clear All</button>
      <button id="checkoutBtn">Check Out</button>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    const trn = sessionStorage.getItem('loggedInUser');
    function showCart(){
      if(!trn){ alert('Please login'); window.location.href='index.html'; return; }
      renderCart(trn);
    }
    document.getElementById('clearCart').addEventListener('click', ()=>{
      clearCart(trn);
      showCart();
    });
    document.getElementById('checkoutBtn').addEventListener('click', ()=>{
      window.location.href='checkout.html';
    });
    showCart();
  </script>
</body>
</html>
